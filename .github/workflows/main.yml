
name: CI devops

# Run CI when code is pushed to main or develop.
# Also run CI when a pull request is opened or updated.
"on":
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      # Download the repository code.
      - name: Checkout code
        uses: actions/checkout@v4

      # Install the Java version required by pom.xml.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Build the backend and run tests.
      - name: Build and test with Maven
        run: mvn -B clean verify --file backend/simple-api-student/pom.xml
