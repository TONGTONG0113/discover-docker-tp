name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push-docker-image:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend/simple-api-student
          push: true
          tags: |
            allgreenallright/docker-tp-backend:latest
            allgreenallright/docker-tp-backend:${{ github.event.workflow_run.head_sha }}

      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: true
          tags: |
            allgreenallright/docker-tp-database:latest
            allgreenallright/docker-tp-database:${{ github.event.workflow_run.head_sha }}

      - name: Build and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./httpd
          push: true
          tags: |
            allgreenallright/docker-tp-httpd:latest
            allgreenallright/docker-tp-httpd:${{ github.event.workflow_run.head_sha }}

  deploy:
    needs: build-and-push-docker-image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install community.docker

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Create CI inventory
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          cat > "$RUNNER_TEMP/inventory.yml" <<EOF_INVENTORY
          all:
            vars:
              ansible_user: "${SSH_USER}"
              ansible_ssh_private_key_file: "$HOME/.ssh/deploy_key"
              ansible_python_interpreter: /opt/docker_venv/bin/python
            hosts:
              "${SSH_HOST}":
          EOF_INVENTORY
          
      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -eu

          if [ -z "$SSH_HOST" ]; then
            echo "ERROR: SSH_HOST is empty"
            exit 1
          fi

          if [ -z "$SSH_USER" ]; then
            echo "ERROR: SSH_USER is empty"
            exit 1
          fi

          if [ ! -s ~/.ssh/deploy_key ]; then
            echo "ERROR: SSH private key is missing or empty"
            exit 1
          fi

          echo "SSH host and user are configured."
          ssh -vv \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" \
            "echo SSH_CONNECTION_OK"

      - name: Test Ansible connection
        run: |
          ansible all \
            -i "$RUNNER_TEMP/inventory.yml" \
            -m ping \
            -vvv

      - name: Deploy with Ansible
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > "$RUNNER_TEMP/vault-password"
          chmod 600 "$RUNNER_TEMP/vault-password"

          ansible-playbook -vvv \
            -i "$RUNNER_TEMP/inventory.yml" \
            ansible/site.yml \
            --private-key ~/.ssh/deploy_key \
            --vault-password-file "$RUNNER_TEMP/vault-password"

