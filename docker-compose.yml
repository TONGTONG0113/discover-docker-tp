services:
  database:
    build: ./database
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pwd}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usr -d db"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend/simple-api-student
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

  front:
    build: ./front
    depends_on:
      - backend
    networks:
      - app-network

  httpd:
    build: ./httpd
    ports:
      - "8083:80"
    depends_on:
      - backend
      - front
    networks:
      - app-network

networks:
  app-network:

volumes:
  postgres-data:
    name: postgres-data
