---
- name: Pull HTTPD image from Docker Hub
  community.docker.docker_image:
    name: "allgreenallright/docker-tp-httpd:{{ image_tag }}"
    source: pull

- name: Start HTTPD container
  community.docker.docker_container:
    name: httpd
    image: "allgreenallright/docker-tp-httpd:{{ image_tag }}"
    state: started
    restart_policy: unless-stopped
    pull: true
    ports:
      - "8080:80"
    networks:
      - name: app-network
