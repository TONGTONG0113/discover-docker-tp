---
# tasks file for roles/httpd

- name: Create HTTPD build directory
  ansible.builtin.file:
    path: /opt/httpd-build
    state: directory
    mode: "0755"

- name: Copy HTTPD project files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../httpd/"
    dest: /opt/httpd-build/
    mode: preserve

- name: Build HTTPD Docker image
  community.docker.docker_image:
    name: student-httpd
    tag: latest
    source: build
    build:
      path: /opt/httpd-build

- name: Start HTTPD container
  community.docker.docker_container:
    name: httpd
    image: student-httpd:latest
    state: started
    restart_policy: unless-stopped
    ports:
      - "8083:80"
    networks:
      - name: app-network

