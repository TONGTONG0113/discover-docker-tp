---
- name: Create PostgreSQL data volume
  community.docker.docker_volume:
    name: postgres-data
    state: present

- name: Pull database image from Docker Hub
  community.docker.docker_image:
    name: "allgreenallright/docker-tp-database:{{ image_tag }}"
    source: pull

- name: Start PostgreSQL database container
  community.docker.docker_container:
    name: database
    image: "allgreenallright/docker-tp-database:{{ image_tag }}"
    state: started
    restart_policy: unless-stopped
    pull: true
    env:
      POSTGRES_DB: db
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: "{{ postgres_password }}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - name: app-network
